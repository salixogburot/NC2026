let wxData = null;

function wmoIcon(code) {
  if (code === 0) return '☀️';
  if (code <= 2)  return '⛅';
  if (code <= 3)  return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌦️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '🌨️';
  if (code <= 82) return '🌦️';
  if (code <= 86) return '🌨️';
  return '⛈️';
}

function lookupWeather(dag, tid) {
  if (!wxData) return null;
  const hour = tid.split(':')[0].padStart(2, '0');
  const idx = wxData.times.indexOf(`${dagDato[dag]}T${hour}:00`);
  if (idx === -1) return null;
  return { icon: wmoIcon(wxData.code[idx]), temp: Math.round(wxData.temp[idx]), precip: wxData.precip[idx] };
}

function fillWeather() {
  if (!wxData) return;
  synlige.forEach((k, i) => {
    const el = document.getElementById('wx-' + i);
    if (!el) return;
    if (kampErAvsluttet(k)) return;
    const wx = lookupWeather(k.dag, k.tid);
    if (!wx) return;
    const precipPart = wx.precip != null ? `${wx.precip}% sjanse for nedbør · ` : '';
    el.innerHTML = `${wx.icon} ${wx.temp}° · ${precipPart}<span class="kamp-wx-label">prognose</span>`;
  });
}

  'HMH':{lag:[1], rolle:'spiller'},
  'IBT':{lag:[1], rolle:'spiller'},
  'IST':{lag:[1], rolle:'spiller'},
  'IUTO':{lag:[1], rolle:'spiller'},
  'KR':{lag:[1], rolle:'spiller'},
  'OSMyk':{lag:[1], rolle:'spiller'},
  // --- Oppsal 1 lagledere ---
  'KMT':{lag:[1], rolle:'lagleder', navn:'Knut Marius', prioritet:true},
  'EUR':{lag:[1], rolle:'lagleder', navn:'Eilif'},
  'MKS':{lag:[1], rolle:'lagleder', navn:'Mette'},
  'SBT':{lag:[1], rolle:'lagleder', navn:'Sigrid'},
  'SG':{lag:[1], rolle:'lagleder', navn:'Stein'},
  // --- Oppsal 2 spillere ---
  'ADN':{lag:[2], rolle:'spiller'},
  'AHR':{lag:[2], rolle:'spiller'},
  'ALBB':{lag:[2], rolle:'spiller'},
  'ESS':{lag:[2], rolle:'spiller'},
  'IB':{lag:[2], rolle:'spiller'},
  'JWN':{lag:[2], rolle:'spiller'},
  'LBM':{lag:[2], rolle:'spiller'},
  'OSMyu':{lag:[2], rolle:'spiller'},
  'SNK':{lag:[2], rolle:'spiller'},
  'STS':{lag:[2], rolle:'spiller'},
  'YFW':{lag:[2], rolle:'spiller'},
  // --- Oppsal 2 lagledere ---
  'AW':{lag:[2], rolle:'lagleder', navn:'Anders', prioritet:true},
  'HDN':{lag:[2], rolle:'lagleder', navn:'Halvor'},
  'KEB':{lag:[2], rolle:'lagleder', navn:'Karol'},
  'KFW':{lag:[2], rolle:'lagleder', navn:'Kristin'},
};

let aktivLag = 'alle', aktivDag = 'alle', aktivSpiller = null;
let visAvsluttede = false;
let synlige = [];

function kampStart(k) {
  const [hh, mm] = k.tid.split(':').map(Number);
  const d = new Date(dagDato[k.dag]);
  d.setHours(hh, mm, 0, 0);
  return d;
}

function kampErAvsluttet(k) {
  return new Date() >= new Date(kampStart(k).getTime() + (k.varighetMin || 30) * 60 * 1000);
}

function lagFilterOK(k) {
  if (k.arrangement) return true;
  return aktivSpiller ? aktivSpiller.includes(k.lag) : (aktivLag === 'alle' || k.lag === aktivLag);
}

function matcherFilter(k) {
  return lagFilterOK(k) && (aktivDag === 'alle' || k.dag === aktivDag);
}

function finnNesteKamp() {
  return kamper
    .map((k, i) => ({ ...k, _i: i }))
    .filter(k => !k.arrangement && lagFilterOK(k) && !kampErAvsluttet(k))
    .sort((a, b) => {
      const di = dagOrder.indexOf(a.dag) - dagOrder.indexOf(b.dag);
      return di !== 0 ? di : a.tid.localeCompare(b.tid);
    })[0] || null;
}

function finnAktivNesteKamp() {
  const k = finnNesteKamp();
  return k && (aktivDag === 'alle' || aktivDag === k.dag) ? k : null;
}

function renderNesteKamp() {
  const el = document.getElementById('neste-kamp');
  const k = finnAktivNesteKamp();
  if (!k) { el.innerHTML = ''; return; }

  el.innerHTML = `<h3 class="dag-header">${dagLabelFull[k.dag]}</h3>
    <div class="neste-kamp-label">⭐ Neste kamp</div>
    <div class="kamp kamp-pin ${dagKlasse[k.dag]}">
      <div class="kamp-top">
        <span class="lag-badge ${badges[k.lag]}">Oppsal ${k.lag}</span>
        <div class="kamp-tidblokk">
          <div class="kamp-tid">${k.tid}</div>
          <div class="kamp-dag">${dagLabel[k.dag]}</div>
        </div>
      </div>
      <div class="kamp-teams">${k.hjem} – ${k.borte}</div>
      <div class="kamp-arena">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
        ${k.arena}
      </div>
      <div class="kamp-wx" id="wx-neste"></div>
      <div class="oppmote-linje" id="om-neste">${oppmoteHTML(k)}</div>
      <div class="nedtelling" id="nd-neste">${nedtellingHTML(k)}</div>
      ${k.bursdag ? `<div class="bursdag-linje">${k.bursdag}</div>` : ''}
    </div>`;

  if (wxData) {
    const wx = lookupWeather(k.dag, k.tid);
    if (wx) {
      const precipPart = wx.precip != null ? `${wx.precip}% sjanse for nedbør · ` : '';
      document.getElementById('wx-neste').innerHTML = `${wx.icon} ${wx.temp}° · ${precipPart}<span class="kamp-wx-label">prognose</span>`;
    }
  }
}

function toggleAvsluttede() {
  visAvsluttede = !visAvsluttede;
  document.getElementById('avsluttede-toggle').textContent = visAvsluttede ? 'Skjul avsluttede' : 'Vis avsluttede';
  render();
}

function oppmoteHTML(k) {
  const now     = new Date();
  const start   = kampStart(k);
  const oppmote = new Date(start.getTime() - 35 * 60 * 1000);

  if (now >= start) return '';

  if (now >= oppmote) {
    return `❗ <span class="nd-label">Seneste oppmøte nå!</span>`;
  }

  const sek   = Math.floor((oppmote - now) / 1000);
  const min   = Math.floor(sek / 60);
  const timer = Math.floor(min / 60);
  const dager = Math.floor(timer / 24);

  if (min < 60) {
    const s = sek % 60;
    const m = min % 60;
    return `❗ <span class="nd-label">Seneste oppmøte om</span> <span class="nd-snart">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>`;
  }
  if (timer < 24) {
    return `❗ <span class="nd-label">Seneste oppmøte om</span> <span class="nd-tall">${timer}t ${min % 60}min</span>`;
  }
  return `❗ <span class="nd-label">Seneste oppmøte om</span> <span class="nd-tall">${dager}d ${timer % 24}t</span>`;
}

function nedtellingHTML(k) {
  const now   = new Date();
  const start = kampStart(k);
  const slutt = new Date(start.getTime() + (k.varighetMin || 30) * 60 * 1000);

  if (now >= slutt) {
    return `<span class="nd-pill nd-avsluttet">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Avsluttet
    </span>`;
  }

  if (now >= start) {
    return `<span class="nd-pill nd-startet">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
      Startet
    </span>`;
  }

  const sek  = Math.floor((start - now) / 1000);
  const min  = Math.floor(sek / 60);
  const timer = Math.floor(min / 60);
  const dager = Math.floor(timer / 24);

  const emoji = k.arrangement ? '🍕' : '⚽';
  const label = k.arrangement ? 'Pizza om' : 'Avspark om';

  if (min < 60) {
    const s = sek % 60;
    const m = min % 60;
    return `${emoji} <span class="nd-label">${label}</span> <span class="nd-snart">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>`;
  }
  if (timer < 24) {
    const h = timer;
    const m = min % 60;
    return `${emoji} <span class="nd-label">${label}</span> <span class="nd-tall">${h}t ${m}min</span>`;
  }
  return `${emoji} <span class="nd-label">${label}</span> <span class="nd-tall">${dager}d ${timer % 24}t</span>`;
}

const dagOrder  = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag'];
const dagKlasse = { søndag:'d-sun', mandag:'d-mon', tirsdag:'d-tue', onsdag:'d-wed', torsdag:'d-thu', fredag:'d-fri' };

function getLagledereNavn(lagNr) {
  return Object.values(spillere)
    .filter(s => s.rolle === 'lagleder' && s.lag.includes(lagNr))
    .sort((a, b) => {
      if (a.prioritet && !b.prioritet) return -1;
      if (!a.prioritet && b.prioritet) return 1;
      return a.navn.localeCompare(b.navn, 'no');
    })
    .map(s => s.navn);
}

function fmtLagledere(lagNr) {
  const all = Object.values(spillere)
    .filter(s => s.rolle === 'lagleder' && s.lag.includes(lagNr))
    .sort((a, b) => {
      if (a.prioritet && !b.prioritet) return -1;
      if (!a.prioritet && b.prioritet) return 1;
      return a.navn.localeCompare(b.navn, 'no');
    });
  const prio = all.filter(s => s.prioritet).map(s => s.navn);
  const rest = all.filter(s => !s.prioritet).map(s => s.navn);
  return prio.length && rest.length
    ? `${prio.join(', ')} + ${rest.join(', ')}`
    : [...prio, ...rest].join(', ');
}

function renderLagledere() {
  const el = document.getElementById('lagleder-linje');
  if (!el) return;
  const oppmoteNote = '<span class="ll-note">Oppmøte 30–45 minutter før avspark</span>';
  if (aktivLag === 'alle') {
    el.innerHTML = `<span class="ll-team">Oppsal 1:</span> ${fmtLagledere(1)}<br><span class="ll-team">Oppsal 2:</span> ${fmtLagledere(2)}${oppmoteNote}`;
  } else {
    el.innerHTML = `<span class="ll-team">Lagledere:</span> ${fmtLagledere(aktivLag)}${oppmoteNote}`;
  }
}

function setDay(dag) {
  aktivDag = dag;
  document.querySelectorAll('.dbtn').forEach((b, i) => {
    b.classList.toggle('active', ['alle',...dagOrder][i] === dag);
  });
  render();
}

const lagColors = { 1:'b1', 2:'b2' };
const lagNames  = { 1:'Oppsal 1', 2:'Oppsal 2' };
let sugFocusIdx = -1;

function setLag(lag) {
  aktivLag = lag;
  aktivSpiller = null;
  document.getElementById('spiller-input').value = '';
  document.getElementById('spiller-clear').classList.remove('vis');
  document.getElementById('spiller-tag').classList.remove('vis');
  const btns = document.querySelectorAll('.lbtn');
  btns.forEach(b => b.className = 'lbtn');
  if (lag === 'alle') btns[0].classList.add('active-alle');
  else btns[lag].classList.add('active-' + lag);
  renderLagledere();
  render();
}

function getSuggestions(key) {
  if (!key) return [];
  return Object.keys(spillere)
    .filter(i => i.startsWith(key))
    .sort()
    .slice(0, 6);
}

function renderSuggestions(key) {
  const box = document.getElementById('spiller-suggestions');
  const matches = getSuggestions(key);
  sugFocusIdx = -1;
  if (!key || matches.length === 0) { box.classList.remove('vis'); return; }

  box.innerHTML = matches.map((init) => {
    const info = spillere[init];
    const highlighted = `<span class="sug-match">${init.slice(0, key.length)}</span>${init.slice(key.length)}`;
    const rollePill = `<span class="rolle-pill${info.rolle === 'lagleder' ? ' rolle-lagleder' : ''}">${info.rolle}</span>`;
    const lagPills = info.lag.map(l =>
      `<span class="sug-lag ${lagColors[l]}">${lagNames[l]}</span>`
    ).join(' ');
    const navnHTML = info.rolle === 'lagleder'
      ? `<span class="sug-navn">${info.navn}</span>`
      : '';
    return `<div class="sug-item" data-init="${init}" onmousedown="selectSuggestion('${init}')">
      <div class="sug-left">
        <span class="sug-initial">${highlighted}</span>
        ${navnHTML}
      </div>
      <div class="sug-right">${rollePill}${lagPills}</div>
    </div>`;
  }).join('');
  box.classList.add('vis');
}

function selectSuggestion(init) {
  document.getElementById('spiller-input').value = init;
  document.getElementById('spiller-suggestions').classList.remove('vis');
  applySpiller(init);
}

function onSpillerInput(val) {
  const key = val.trim().toUpperCase();
  document.getElementById('spiller-clear').classList.toggle('vis', val.length > 0);
  renderSuggestions(key);

  if (!key) {
    aktivSpiller = null;
    document.getElementById('spiller-tag').classList.remove('vis');
    resetLagBtns();
    render();
    return;
  }

  applySpiller(key);
}

function applySpiller(key) {
  const tag = document.getElementById('spiller-tag');
  const info = spillere[key] || null;
  aktivSpiller = info ? info.lag : null;

  if (info) {
    tag.textContent = info.lag.length > 1 ? `Lag ${info.lag.join(' & ')}` : lagNames[info.lag[0]];
    tag.classList.add('vis');
  } else {
    tag.textContent = 'Ikke funnet';
    tag.classList.add('vis');
  }
  resetLagBtns();
  render();
}

function onSpillerKey(e) {
  const box = document.getElementById('spiller-suggestions');
  const items = box.querySelectorAll('.sug-item');
  if (!box.classList.contains('vis') || items.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    sugFocusIdx = Math.min(sugFocusIdx + 1, items.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    sugFocusIdx = Math.max(sugFocusIdx - 1, 0);
  } else if (e.key === 'Enter' && sugFocusIdx >= 0) {
    e.preventDefault();
    selectSuggestion(items[sugFocusIdx].dataset.init);
    return;
  } else if (e.key === 'Escape') {
    box.classList.remove('vis');
    return;
  } else { return; }

  items.forEach((el, i) => el.classList.toggle('focused', i === sugFocusIdx));
}

function clearSpiller() {
  aktivSpiller = null;
  document.getElementById('spiller-input').value = '';
  document.getElementById('spiller-clear').classList.remove('vis');
  document.getElementById('spiller-tag').classList.remove('vis');
  document.getElementById('spiller-suggestions').classList.remove('vis');
  resetLagBtns();
  render();
}

function resetLagBtns() {
  const btns = document.querySelectorAll('.lbtn');
  btns.forEach(b => b.className = 'lbtn');
  if (aktivLag === 'alle') btns[0].classList.add('active-alle');
  else btns[aktivLag].classList.add('active-' + aktivLag);
}

function render() {
  const neste = finnAktivNesteKamp();
  synlige = kamper
    .map((k, i) => ({ ...k, _i: i }))
    .filter(k => {
      const erNeste = neste && k._i === neste._i;
      return matcherFilter(k) && (visAvsluttede || !kampErAvsluttet(k)) && !erNeste;
    })
    .sort((a, b) => {
      const di = dagOrder.indexOf(a.dag) - dagOrder.indexOf(b.dag);
      return di !== 0 ? di : (a.sorteringstid || a.tid).localeCompare(b.sorteringstid || b.tid);
    });

  document.getElementById('count').textContent = synlige.length + ' kamper';

  const el = document.getElementById('liste');
  if (!synlige.length) {
    const header = aktivDag !== 'alle' && !neste ? `<h3 class="dag-header">${dagLabelFull[aktivDag]}</h3>` : '';
    const melding = kamper.some(matcherFilter) ? 'Alle kamper avsluttet' : 'Ingen kamper funnet';
    el.innerHTML = `${header}<div class="empty">${melding}</div>`;
    renderNesteKamp();
    return;
  }

  let lastDag = neste ? neste.dag : null;
  el.innerHTML = synlige.map((k, i) => {
    let header = '';
    if (aktivDag === 'alle' && k.dag !== lastDag) {
      header = `<h3 class="dag-header">${dagLabelFull[k.dag]}</h3>`;
      lastDag = k.dag;
    } else if (aktivDag !== 'alle' && lastDag === null) {
      header = `<h3 class="dag-header">${dagLabelFull[k.dag]}</h3>`;
      lastDag = k.dag;
    }
    if (k.arrangement) {
      return `${header}<div class="kamp kamp-arrangement ${dagKlasse[k.dag]}">
        <div class="kamp-top">
          <span class="lag-badge b-arr">Begge lag</span>
          <div class="kamp-tidblokk">
            <div class="kamp-tid">${k.tidVisning || k.tid}</div>
            <div class="kamp-dag">${dagLabel[k.dag]}</div>
          </div>
        </div>
        <div class="kamp-teams">${k.tittel}</div>
        <div class="kamp-arena">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
          ${k.arena}
        </div>
        <div class="arrangement-tekst">${k.tekst}</div>
        <div class="kamp-wx" id="wx-${i}"></div>
        <div class="nedtelling" id="nd-${i}">${nedtellingHTML(k)}</div>
      </div>`;
    }
    return `${header}<div class="kamp ${dagKlasse[k.dag]}">
      <div class="kamp-top">
        <span class="lag-badge ${badges[k.lag]}">Oppsal ${k.lag}</span>
        <div class="kamp-tidblokk">
          <div class="kamp-tid">${k.tid}</div>
          <div class="kamp-dag">${dagLabel[k.dag]}</div>
        </div>
      </div>
      <div class="kamp-teams">${k.hjem} – ${k.borte}</div>
      <div class="kamp-arena">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
        ${k.arena}
      </div>
      <div class="kamp-wx" id="wx-${i}"></div>
      <div class="oppmote-linje" id="om-${i}">${oppmoteHTML(k)}</div>
      <div class="nedtelling" id="nd-${i}">${nedtellingHTML(k)}</div>
      ${k.bursdag ? `<div class="bursdag-linje">${k.bursdag}</div>` : ''}
    </div>`;
  }).join('');
  if (wxData) fillWeather();
  renderNesteKamp();
}

function tick() {
  if (!visAvsluttede && synlige.some(kampErAvsluttet)) {
    render();
    return;
  }
  synlige.forEach((k, i) => {
    const nd = document.getElementById('nd-' + i);
    if (nd) nd.innerHTML = nedtellingHTML(k);
    const om = document.getElementById('om-' + i);
    if (om) om.innerHTML = oppmoteHTML(k);
    if (kampErAvsluttet(k)) {
      const wx = document.getElementById('wx-' + i);
      if (wx && wx.innerHTML) wx.innerHTML = '';
    }
  });
  renderNesteKamp();
}

renderLagledere();
render();
setInterval(tick, 1000);

fetch('https://api.open-meteo.com/v1/forecast?latitude=59.887&longitude=10.762&hourly=temperature_2m,precipitation_probability,weathercode&start_date=2026-07-26&end_date=2026-07-31&timezone=Europe%2FOslo')
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    wxData = { times: d.hourly.time, temp: d.hourly.temperature_2m, precip: d.hourly.precipitation_probability, code: d.hourly.weathercode };
    fillWeather();
  })
  .catch(() => {});

document.addEventListener('click', e => {
  if (!e.target.closest('.spiller-wrap')) {
    document.getElementById('spiller-suggestions').classList.remove('vis');
  }
});
</script>
